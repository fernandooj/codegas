frecuenciasHandler:
  name: ${self:custom.base}-frecuencias
  handler: services/frecuencias/src/handler.main
  events:
    # === Evento programado principal (creación de pedidos individuales y por grupos) ===
    # Se ejecuta una sola vez al día a las 10:00 PM hora de Bogotá (03:00 AM UTC del día siguiente)
    - schedule:
        rate: cron(0 3 * * ? *)
        input:
          action: crearPedidosFrecuencia

    # Notificación de pedidos a 3 días
    - schedule:
        rate: cron(0 8 * * ? *)
        input:
          action: notificarPedidos3Dias

    # === Endpoints HTTP (todos comparten el mismo handler) ===
    - httpApi: 'GET /fre/frecuencia/semanal'
    - httpApi: 'GET /fre/frecuencia/quincenal'
    - httpApi: 'GET /fre/frecuencia/mensual'
    - httpApi: 'GET /fre/crear-pedidos-frecuencia'
    - httpApi: 'GET /fre/frecuencia'
    - httpApi: 'GET /fre/frecuencia/todas'
    - httpApi: 'PUT /fre/frecuencia/{id}'
    - httpApi: 'DELETE /fre/frecuencia/{id}'
    - httpApi: 'GET /fre/notificar-pedidos-3-dias'
    - httpApi: 'GET /fre/grupos'
    - httpApi: 'POST /fre/grupos'
    - httpApi: 'PUT /fre/grupos/{id}'
    - httpApi: 'DELETE /fre/grupos/{id}'
    - httpApi: 'GET /fre/grupos/{grupoId}/pedidos'
    - httpApi: 'DELETE /fre/grupos/pedidos/{pedidoId}'

  package:
    include:
      - services/frecuencias/src/crear-frecuencia-semanal.js
      - services/frecuencias/src/crear-frecuencia-quincenal.js
      - services/frecuencias/src/crear-frecuencia-mensual.js
      - services/frecuencias/src/crear-pedidos-frecuencia.js
      - services/frecuencias/src/get-frecuencias.js
      - services/frecuencias/src/get-todas-frecuencias.js
      - services/frecuencias/src/editar-frecuencia.js
      - services/frecuencias/src/eliminar-frecuencias.js
      - services/frecuencias/src/notificar-pedidos-3-dias.js
      - services/frecuencias/src/get-grupos-frecuencias.js
      - services/frecuencias/src/create-grupo-frecuencia.js
      - services/frecuencias/src/update-grupo-frecuencia.js
      - services/frecuencias/src/delete-grupo-frecuencia.js
      - services/frecuencias/src/get-pedidos-por-grupo.js
      - services/frecuencias/src/remover-pedido-de-grupo.js
      - services/frecuencias/src/handler.js
      - lib/errors/database-error.js