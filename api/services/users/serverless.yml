createUser:
  name: ${self:custom.base}-save-user
  handler: services/users/src/save-user.main
  events:
    - httpApi: 'POST /users'
  environment:
    EMAIL_USER: ${self:custom.emailUser}
    EMAIL_PASS: ${self:custom.emailPass}
  package:
    include:
      - services/users/src/save-user.js
      - lib/errors/database-error.js
      - assets/img/logo.jpg

getUsers:
  name: ${self:custom.base}-get-users
  handler: services/users/src/get-users.main
  events:
    - httpApi: 'GET /users/acceso/{limit}/{start}/{acceso}/{search}/{id}'
    - httpApi: 'GET /users/acceso/{limit}/{start}/{acceso}'
  package:
    include:
      - services/users/src/get-users.js
      - lib/errors/database-error.js

