magisterPing:
  name: ${self:custom.base}-magister-ping
  handler: services/magister/src/ping.main
  timeout: 60
  environment:
    # Modo de conexión: 'direct' (directa a Firebird) o 'api' (vía API REST)
    MAGISTER_CONNECTION_MODE: ${env:MAGISTER_CONNECTION_MODE, 'api'}
    # URL de la API REST de Magister/Firebird (solo si MODE=api)
    # Opción 1: ngrok (temporal, para desarrollo)
    # Opción 2: Port forwarding (producción) - http://181.63.224.174:65432
    MAGISTER_API_URL: ${env:MAGISTER_API_URL, 'https://kirby-bimodal-brynlee.ngrok-free.dev'}
    # Configuración para conexión directa (solo si MODE=direct)
    # IMPORTANTE: Requiere port forwarding en el router para exponer el puerto 3050
    MAGISTER_DB_HOST: ${env:MAGISTER_DB_HOST, '181.63.224.174'}
    MAGISTER_DB_PORT: ${env:MAGISTER_DB_PORT, '3050'}
    MAGISTER_DB_NAME: ${env:MAGISTER_DB_NAME, 'C:\\MaGister\\Datos\\MaGisterZ.Mgt'}
    MAGISTER_DB_USER: ${env:MAGISTER_DB_USER, 'SYSDBA'}
    MAGISTER_DB_PASSWORD: ${env:MAGISTER_DB_PASSWORD, 'masterqey'}
  events:
    - httpApi: 'GET /magister/ping'
  package:
    include:
      - services/magister/src/ping.js
      - lib/magister-api.js
      - lib/magister-db.js

