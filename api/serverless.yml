service: codegas
frameworkVersion: '^3.38.0'
# app and org for use with dashboard.serverless.com
#app: your-app-name
#org: your-org-name
plugins:
  - serverless-dotenv-plugin
  - serverless-offline
  - serverless-webpack
  - serverless-iam-roles-per-function
  - serverless-plugin-split-stacks
 
  
provider:
  name: aws
  runtime: nodejs16.x
  # Desactivar creación de versiones de Lambda para reducir recursos de CloudFormation
  # Esto ayuda a evitar el límite de 500 recursos por stack.
  versionFunctions: false
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, "us-east-1"}
  httpApi:
    cors: true
  environment:
    # Redis Configuration (opcional para tracking)
    REDIS_ENABLED: ${env:REDIS_ENABLED, 'false'}
    REDIS_HOST: ${env:REDIS_HOST, ''}
    REDIS_PORT: ${env:REDIS_PORT, '6379'}
  apiGateway:
      binaryMediaTypes:
          - '*/*'
  iam:
    role:
      statements:
        # Allow functions to list all buckets
        - Effect: Allow
          Action: 's3:ListBucket'
          Resource: '*'
        # Allow functions to read/write objects in a bucket
        - Effect: Allow
          Action:
            - 's3:GetObject'
            - 's3:PutObject'
          Resource:
            - 'arn:aws:s3:::newcodegas/*'
        # Allow functions to read/write objects in emergencias folder in codegas bucket
        - Effect: Allow
          Action:
            - 's3:GetObject'
            - 's3:PutObject'
            - 's3:PutObjectAcl'
          Resource:
            - 'arn:aws:s3:::newcodegas/emergencias/*'
        - Effect: Allow
          Action:
            - 'ses:SendEmail'
            - 'ses:SendRawEmail'
          Resource: '*'
    
  # apiGateway:
  #   restApiId: ${output:${self:custom.n}.ApiId}
  #   restApiRootResourceId: ${output:${self:custom.n}.ApiResourceId}

custom:
  serverless-offline:
    httpPort: 4000
    host: 0.0.0.0
  dotenv:
    path: .env
  # Variables de entorno temporales
  emailUser: admin@codegascolombia.com
  emailPass: hkbi efvr jwua gtkq
  # Twilio Configuration (usar variables de entorno en producción)
  twilioAccountSid: ${env:TWILIO_ACCOUNT_SID, 'AC6459a9e513d5d8ecd3887fd3a95f4556'}
  twilioAuthToken: ${env:TWILIO_AUTH_TOKEN, 'bbce5c30ce7ac91cf34ca6ee3a3f9fa0'}
  twilioWhatsAppNumber: ${env:TWILIO_WHATSAPP_NUMBER, 'whatsapp:+14155238886'}
  webpack:
    webpackConfig: 'webpack.config.js'
    includeModules: true
    packager: 'npm'
    excludeFiles: src/**/*.test.js
  n: my-app:${self:provider.stage}:${self:provider.region}:api
  base: ${self:service}-${self:provider.stage}
  splitStacks:
    # Estrategia final: perFunction con threshold bajo y forzar división
    perFunction: true
    perType: false
    perGroupFunction: false
    stackConcurrency: 10
    nestedStackCount: 25

package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!node_modules/.bin/**'
    - '!node_modules/.cache/**'
    - '!node_modules/.yarn/**'
    - '!**/*.md'
    - '!**/*.txt'
    - '!**/*.log'
    - '!**/test/**'
    - '!**/tests/**'
    - '!**/__tests__/**'
    - '!**/*.test.js'
    - '!**/*.spec.js'
    - '!**/coverage/**'
    - '!**/.git/**'
    - '!**/.gitignore'
    - '!**/README.md'
    - '!**/yarn.lock'
    - '!**/package-lock.json'
    - '!**/tsconfig.json'
    - '!**/.eslintrc*'
    - '!**/jest.config*'
    - '!**/webpack.config.js'
    - '!**/.env*'
    - '!**/firebase-service-account*.json'
    - '!**/error-templates/**'
    - '!**/envs/**'
    - '!**/assets/**'
    - '!**/docs/**'
    - '!**/examples/**'
    - '!**/scripts/**'
    - '!**/.*'

functions: 
  - ${file(./services/users/serverless.yml)}
  - ${file(./services/zonas/serverless.yml)}
  - ${file(./services/puntos/serverless.yml)}
  - ${file(./services/vehiculos/serverless.yml)}
  - ${file(./services/tracking/serverless.yml)}
  - ${file(./services/pedidos/serverless.yml)}
  - ${file(./services/magister/serverless.yml)}
  - ${file(./services/tanques/serverless.yml)}
  #- ${file(./services/revisiones/serverless.yml)}
  #- ${file(./services/alerta-tanque/serverless.yml)}
  - ${file(./services/frecuencias/serverless.yml)}
  # - ${file(./services/informes/serverless.yml)}  
  - ${file(./services/reporte-emergencia/serverless.yml)}
  - ${file(./services/planillas/serverless.yml)}
  - ${file(./services/upload/serverless.yml)}