service: codegas
frameworkVersion: '3.38.0'
# app and org for use with dashboard.serverless.com
#app: your-app-name
#org: your-org-name
plugins:
  - serverless-dotenv-plugin
  - serverless-offline
  - serverless-webpack
  - serverless-iam-roles-per-function
  - serverless-plugin-split-stacks
 
  
provider:
  name: aws
  runtime: nodejs16.x
  stage: ${opt:stage, 'dev'}
  region: ${opt:region, "us-east-1"}
  httpApi:
    cors: true
  apiGateway:
      binaryMediaTypes:
          - '*/*'
  iam:
    role:
      statements:
        # Allow functions to list all buckets
        - Effect: Allow
          Action: 's3:ListBucket'
          Resource: '*'
        # Allow functions to read/write objects in a bucket
        - Effect: Allow
          Action:
            - 's3:GetObject'
            - 's3:PutObject'
          Resource:
            - 'arn:aws:s3:::codegas/*'
        - Effect: Allow
          Action:
            - 'ses:SendEmail'
            - 'ses:SendRawEmail'
          Resource: '*'
    
  # apiGateway:
  #   restApiId: ${output:${self:custom.n}.ApiId}
  #   restApiRootResourceId: ${output:${self:custom.n}.ApiResourceId}

custom:
  serverless-offline:
    httpPort: 4000
    host: 0.0.0.0
  dotenv:
    path: .env
  # Variables de entorno temporales
  emailUser: admin@codegascolombia.com
  emailPass: yecn iasc womb wkri
  webpack:
    webpackConfig: 'webpack.config.js'
    includeModules: true
    packager: 'npm'
    excludeFiles: src/**/*.test.js
  n: my-app:${self:provider.stage}:${self:provider.region}:api
  base: ${self:service}-${self:provider.stage}
  splitStacks:
    perFunction: false
    perType: true
    perGroupFunction: false
    stackConcurrency: 10

package:
  individually: true
  patterns:
    - '!node_modules/**'
    - '!node_modules/.bin/**'
    - '!node_modules/.cache/**'
    - '!node_modules/.yarn/**'
    - '!**/*.md'
    - '!**/*.txt'
    - '!**/*.log'
    - '!**/test/**'
    - '!**/tests/**'
    - '!**/__tests__/**'
    - '!**/*.test.js'
    - '!**/*.spec.js'
    - '!**/coverage/**'
    - '!**/.git/**'
    - '!**/.gitignore'
    - '!**/README.md'
    - '!**/yarn.lock'
    - '!**/package-lock.json'
    - '!**/tsconfig.json'
    - '!**/.eslintrc*'
    - '!**/jest.config*'
    - '!**/webpack.config.js'
    - '!**/.env*'
    - '!**/firebase-service-account*.json'
    - '!**/error-templates/**'
    - '!**/envs/**'
    - '!**/assets/**'
    - '!**/docs/**'
    - '!**/examples/**'
    - '!**/scripts/**'
    - '!**/.*'

functions: 
  - ${file(./services/users/serverless.yml)}
  - ${file(./services/zonas/serverless.yml)}
  - ${file(./services/puntos/serverless.yml)}
  - ${file(./services/vehiculos/serverless.yml)}
  - ${file(./services/pedidos/serverless.yml)}
  - ${file(./services/tanques/serverless.yml)}
  - ${file(./services/revisiones/serverless.yml)}
  - ${file(./services/alerta-tanque/serverless.yml)}
  - ${file(./services/frecuencias/serverless.yml)}
  - ${file(./services/informes/serverless.yml)}  
  - ${file(./services/reporte-emergencia/serverless.yml)}
